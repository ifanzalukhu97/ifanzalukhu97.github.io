  <style>
    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #10151c;
      --accent: #aaff00;
      --accent-hover: #88cc00;
      --text-primary: #e6edf3;
      --text-bright: #f0f6fc;
      --text-secondary: #8b949e;
      --text-muted: #6e7681;
      --border: #21262d;
      --border-strong: #30363d;
      --radius-card: 12px;
      --radius-pill: 20px;
      --radius-btn: 8px;
      --max-width: 1120px;
      --gutter: 40px;
      --rail: 240px;
      --font-sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
      --font-display: "Instrument Serif", Georgia, serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.55;
    }

    a { color: var(--text-primary); text-decoration: none; transition: color .15s ease, border-color .15s ease; }
    a:hover { color: var(--accent); }
    img { max-width: 100%; }
    ::selection { background: rgba(170, 255, 0, .22); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    /* ---------- Layout primitives ---------- */

    .wrap { max-width: var(--max-width); margin: 0 auto; padding: 0 var(--gutter); }

    section.band { border-top: 1px solid var(--border); padding: 80px 0; }
    section.band.alt { background: var(--bg-tertiary); }

    /* Two-column editorial grid: mono section label on the rail, content on the right */
    .split { display: grid; grid-template-columns: var(--rail) 1fr; gap: 64px; }
    .split.align-end { align-items: end; }

    .section-label {
      margin: 0;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .section-intro { margin: 0; max-width: 52ch; font-size: 16.5px; line-height: 1.65; color: var(--text-secondary); }

    .lede {
      margin: 0 0 26px;
      font-family: var(--font-display);
      font-size: 32px;
      line-height: 1.32;
      letter-spacing: -.015em;
      color: var(--text-bright);
      max-width: 30ch;
      text-wrap: pretty;
    }

    .mono-meta { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); }

    /* ---------- Header ---------- */

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(13, 17, 23, .82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .site-header .wrap { height: 66px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
    .wordmark { display: flex; align-items: baseline; gap: 10px; }
    .wordmark strong { font-family: var(--font-display); font-weight: 400; font-size: 22px; letter-spacing: -.01em; }
    .wordmark span { font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-secondary); }

    .site-nav { display: flex; align-items: center; gap: 26px; font-size: 13.5px; color: var(--text-secondary); }
    .site-nav .nav-links { display: flex; align-items: center; gap: 26px; }
    .site-nav a { color: inherit; }
    .site-nav .nav-cta {
      padding: 9px 18px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-btn);
      font-size: 13px;
      color: var(--text-primary);
    }
    .site-nav .nav-cta:hover { border-color: var(--accent); color: var(--accent); }

    /* Mobile menu toggle */
    .nav-toggle { display: none; background: none; border: none; padding: 8px; cursor: pointer; color: var(--text-primary); }
    .nav-toggle svg { display: block; }

    .mobile-menu {
      display: none; position: fixed; inset: 0; z-index: 30;
      background: rgba(13, 17, 23, .96); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      flex-direction: column; align-items: center; justify-content: center; gap: 32px;
    }
    .mobile-menu.open { display: flex; }
    .mobile-menu a {
      font-family: var(--font-display); font-size: 28px; color: var(--text-primary);
      letter-spacing: -.01em;
    }
    .mobile-menu a:hover { color: var(--accent); }
    .mobile-menu .nav-cta {
      margin-top: 16px; padding: 14px 28px; border: 1px solid var(--border-strong);
      border-radius: var(--radius-btn); font-family: var(--font-sans); font-size: 14px;
    }
    .mobile-close {
      position: absolute; top: 20px; right: 24px; background: none; border: none;
      color: var(--text-primary); cursor: pointer; padding: 8px;
    }
    .mobile-close svg { display: block; }

    /* ---------- Hero ---------- */

    .hero { padding: 96px 0 84px; }
    .hero-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 64px; align-items: end; }

    .eyebrow {
      display: flex; align-items: center; gap: 12px;
      font-family: var(--font-mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 26px;
    }
    .eyebrow::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

    .hero h1 {
      margin: 0 0 24px;
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 76px;
      line-height: 1.03;
      letter-spacing: -.025em;
      color: var(--text-bright);
    }
    .tagline { margin: 0 0 36px; max-width: 48ch; font-size: 18.5px; line-height: 1.65; color: var(--text-secondary); text-wrap: pretty; }

    .cta-group { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 48px; }
    .btn-primary {
      padding: 14px 26px; background: var(--accent); color: var(--bg-primary);
      border-radius: var(--radius-btn); font-size: 14.5px; font-weight: 500;
    }
    .btn-primary:hover { background: var(--accent-hover); color: var(--bg-primary); }
    .btn-secondary {
      padding: 14px 26px; border: 1px solid var(--border-strong);
      border-radius: var(--radius-btn); font-size: 14.5px; color: var(--text-primary);
    }
    .btn-secondary:hover { border-color: var(--accent); }

    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; border-top: 1px solid var(--border); padding-top: 26px; }
    .stats dt { font-family: var(--font-display); font-size: 34px; line-height: 1; color: var(--text-bright); }
    .stats dd {
      margin: 6px 0 0; font-family: var(--font-mono); font-size: 10.5px;
      letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted);
    }

    .portrait {
      width: 100%; aspect-ratio: 3 / 4; object-fit: cover; display: block;
      border-radius: var(--radius-card); border: 1px solid var(--border-strong); background: var(--bg-secondary);
    }
    .portrait-note { margin: 14px 0 0; font-family: var(--font-mono); font-size: 11px; line-height: 1.7; color: var(--text-muted); }

    /* ---------- About ---------- */

    .about-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 36px; max-width: 760px; }
    .about-cols p { margin: 0; font-size: 15.5px; line-height: 1.78; color: var(--text-secondary); text-wrap: pretty; }

    /* ---------- Cards (What I Do) ---------- */

    .cards-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .card {
      background: var(--bg-secondary); border: 1px solid var(--border);
      border-radius: var(--radius-card); padding: 34px;
    }
    .card:hover { border-color: var(--border-strong); }
    .card-index { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
    .card-index span { font-family: var(--font-mono); font-size: 11px; color: var(--accent); }
    .card-index i { flex: 1; height: 1px; background: var(--border); }
    .card h3 {
      margin: 0 0 12px; font-family: var(--font-display); font-weight: 400;
      font-size: 26px; letter-spacing: -.01em; color: var(--text-bright);
    }
    .card p { margin: 0 0 20px; font-size: 15px; line-height: 1.7; color: var(--text-secondary); text-wrap: pretty; }
    .card .card-tech { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; color: var(--text-muted); }

    /* ---------- Speaking ---------- */

    .photo-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
    .photo-grid figure { margin: 0; }
    .photo-grid img {
      width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block;
      border-radius: var(--radius-card); border: 1px solid var(--border); background: var(--bg-secondary);
    }
    .photo-grid figcaption { margin-top: 10px; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em; color: var(--text-muted); }

    .badges { display: flex; flex-wrap: wrap; gap: 10px; }
    .badge {
      padding: 10px 18px; background: var(--bg-secondary); border: 1px solid var(--border);
      border-radius: var(--radius-pill); font-family: var(--font-mono); font-size: 11.5px;
      letter-spacing: .04em; color: var(--text-secondary);
    }
    .badge-link { border-color: var(--border-strong); color: var(--text-primary); }
    .badge-link:hover { border-color: var(--accent); color: var(--accent); }

    /* ---------- Articles + slides ---------- */

    .articles-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
    .article-card {
      display: block; background: var(--bg-secondary); border: 1px solid var(--border);
      border-radius: var(--radius-card); padding: 26px;
    }
    .article-card:hover { border-color: var(--accent); }
    .article-card .article-meta { margin-bottom: 12px; }
    .article-card .article-title {
      font-family: var(--font-display); font-size: 22px; line-height: 1.28;
      letter-spacing: -.01em; color: var(--text-bright);
    }
    .articles-fallback {
      background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-card);
      padding: 28px; margin-bottom: 24px; font-size: 15px; color: var(--text-secondary);
    }
    .articles-fallback a { color: var(--accent); }

    .read-more-links { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 48px; }
    .read-more-links a {
      padding: 10px 18px; border: 1px solid var(--border-strong);
      border-radius: var(--radius-btn); font-size: 13px; color: var(--text-primary);
    }
    .read-more-links a:hover { border-color: var(--accent); color: var(--accent); }

    .subhead { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; }

    .slide-item {
      display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: baseline;
      padding: 22px 0; border-bottom: 1px solid var(--border);
    }
    .slide-item:hover { background: #12181f; }
    .slide-title { font-family: var(--font-display); font-size: 23px; letter-spacing: -.01em; line-height: 1.25; color: var(--text-bright); }
    .slide-event { margin-top: 6px; font-size: 14px; color: var(--text-secondary); }
    .slide-date { white-space: nowrap; }

    /* ---------- Tech stack ---------- */

    .tech-category { padding: 20px 0; border-top: 1px solid var(--border); }
    .tech-category h3 { margin: 0; font-size: 14.5px; font-weight: 500; color: var(--text-primary); }
    .tech-pills { display: flex; flex-wrap: wrap; gap: 8px 10px; font-family: var(--font-mono); font-size: 12.5px; color: var(--text-secondary); }
    .tech-pill { padding: 5px 13px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-pill); }

    /* ---------- Credentials ---------- */

    .creds-grid { display: grid; grid-template-columns: 1.05fr 1fr; gap: 48px; align-items: start; }

    .cert-row { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: baseline; padding: 18px 0; border-top: 1px solid var(--border); }
    .cert-row h3 { margin: 0; font-size: 16px; font-weight: 500; color: var(--text-bright); }
    .cert-row p { margin: 4px 0 0; font-size: 13.5px; color: var(--text-secondary); }
    .cert-row .mono-meta { white-space: nowrap; }

    .cert-links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; border-top: 1px solid var(--border); padding-top: 26px; font-family: var(--font-mono); font-size: 11.5px; }
    .cert-links a { color: var(--accent); }
    .cert-links .sep { color: var(--border-strong); }

    .stat-cards { display: grid; gap: 12px; }
    .stat-card {
      background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-card);
      padding: 22px 24px; display: flex; justify-content: space-between; align-items: baseline; gap: 18px;
    }
    .stat-card h3 { margin: 0; font-size: 15px; font-weight: 500; color: var(--text-bright); }
    .stat-card p { margin: 3px 0 0; font-size: 13px; color: var(--text-secondary); }
    .stat-card .figure { font-family: var(--font-display); font-size: 26px; line-height: 1; color: var(--accent); }

    .devcard-block {
      display: block; background: var(--bg-secondary); border: 1px solid var(--border);
      border-radius: var(--radius-card); padding: 22px 24px;
    }
    .devcard-block:hover { border-color: var(--accent); }
    .devcard-block .mono-meta { letter-spacing: .12em; margin-bottom: 14px; }
    .devcard-img { display: block; width: 100%; border-radius: var(--radius-btn); }

    /* ---------- Connect ---------- */

    .connect-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: start; padding-bottom: 72px; }
    .connect-headline {
      margin: 0 0 20px; font-family: var(--font-display); font-size: 44px; line-height: 1.12;
      letter-spacing: -.02em; max-width: 22ch; color: var(--text-bright);
    }
    .connect-copy { margin: 0 0 30px; max-width: 44ch; font-size: 16px; line-height: 1.7; color: var(--text-secondary); }
    .connect-links { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
    .connect-link {
      display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
      padding: 10px 0; border-bottom: 1px solid var(--border);
      font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary);
    }
    .connect-link:hover { color: var(--accent); border-color: var(--border-strong); }
    .connect-link .arrow { font-size: 10px; }

    /* ---------- Footer ---------- */

    .site-footer { border-top: 1px solid var(--border); }
    .site-footer .wrap {
      padding: 28px var(--gutter); display: flex; justify-content: space-between; align-items: center;
      gap: 20px; flex-wrap: wrap; font-family: var(--font-mono); font-size: 11px;
      letter-spacing: .06em; color: var(--text-muted);
    }

    /* ---------- Responsive ---------- */

    @media (max-width: 1000px) {
      :root { --rail: 180px; }
      .split { gap: 44px; }
      .creds-grid { gap: 36px; }
    }

    @media (max-width: 860px) {
      :root { --gutter: 22px; }
      .site-nav .nav-links { display: none; }
      .site-nav { gap: 12px; }
      .nav-toggle { display: block; }
      .split, .hero-grid, .creds-grid, .connect-grid { grid-template-columns: 1fr; gap: 32px; }
      .cards-grid, .about-cols, .articles-grid, .connect-links { grid-template-columns: 1fr; }
      .photo-grid, .stats { grid-template-columns: repeat(2, 1fr); }
      .hero { padding: 64px 0 56px; }
      .hero.wrap { padding-left: 28px; padding-right: 28px; }
      section.band { padding: 56px 0; }
      .hero h1 { font-size: 40px; }
      .tagline { font-size: 16px; }
      .lede { font-size: 26px; }
      .connect-headline { font-size: 34px; }
      .hero-grid { align-items: start; }
      .portrait { aspect-ratio: 4 / 3; }
    }

    @media (max-width: 380px) {
      .hero h1 { font-size: 34px; }
      .stats { grid-template-columns: 1fr 1fr; gap: 16px; }
      .cta-group { flex-direction: column; }
      .cta-group a { text-align: center; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      * { transition: none !important; }
    }
  </style>
</head>

  <script>
    (function () {
      var grid = document.getElementById('articles-grid');
      if (!grid) return;

      function fallback() {
        grid.innerHTML =
          '<div class="articles-fallback">Latest articles are published on ' +
          '<a href="https://dev.to/ifanzalukhu97" target="_blank" rel="noopener">dev.to/ifanzalukhu97</a>' +
          ' — open the profile for the full list.</div>';
      }

      function fmt(iso) {
        if (!iso) return '';
        var d = new Date(iso);
        if (isNaN(d)) return '';
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      }

      function esc(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
        });
      }

      fetch('https://dev.to/api/articles?username=ifanzalukhu97&per_page=4')
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (rows) {
          if (!Array.isArray(rows) || rows.length === 0) return fallback();
          grid.innerHTML = rows.map(function (a) {
            var meta = fmt(a.published_at);
            if (a.reading_time_minutes) meta += ' · ' + a.reading_time_minutes + ' min read';
            return '<a class="article-card" href="' + esc(a.url) + '" target="_blank" rel="noopener">' +
              '<div class="article-meta mono-meta">' + esc(meta) + '</div>' +
              '<div class="article-title">' + esc(a.title) + '</div>' +
              '</a>';
          }).join('');
        })
        .catch(fallback);
    })();

    (function () {
      if (!(navigator.modelContext && typeof navigator.modelContext.registerTool === 'function')) return;

      var PROFILE = {
        name: "Ifan Jaya Suswanto Zalukhu",
        title: "Head of Engineering, SimpliDOTS",
        tagline: "Senior C# .NET Backend Engineer, AWS Community Builder (AI Engineering)",
        links: {
          linkedin: "https://linkedin.com/in/ifanzalukhu97",
          github: "https://github.com/ifanzalukhu97",
          devto: "https://dev.to/ifanzalukhu97"
        }
      };

      var TALKS = [
        {% for slide in site.slides %}
        { title: {{ slide.title | jsonify }}, event: {{ slide.event | jsonify }}, date: {{ slide.date | date_to_xmlschema | jsonify }}, url: {{ slide.url | jsonify }} }{% unless forloop.last %},{% endunless %}
        {% endfor %}
      ];

      navigator.modelContext.registerTool({
        name: "get_profile",
        description: "Get Ifan Zalukhu's professional profile summary and key links.",
        inputSchema: { type: "object", properties: {} },
        execute: function () { return PROFILE; }
      });

      navigator.modelContext.registerTool({
        name: "list_talks",
        description: "List conference talks and slide decks by Ifan Zalukhu.",
        inputSchema: { type: "object", properties: {} },
        execute: function () { return TALKS; }
      });

      navigator.modelContext.registerTool({
        name: "list_recent_articles",
        description: "List Ifan Zalukhu's most recent dev.to articles.",
        inputSchema: { type: "object", properties: {} },
        execute: function () {
          return fetch('https://dev.to/api/articles?username=ifanzalukhu97&per_page=4')
            .then(function (r) { return r.ok ? r.json() : []; })
            .catch(function () { return []; });
        }
      });
    })();
  </script>
