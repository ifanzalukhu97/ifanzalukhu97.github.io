  <style>
    /* CSS Custom Properties */
    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #1c2128;
      --accent: #aaff00;
      --accent-hover: #88cc00;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --border: #30363d;
      --radius-card: 12px;
      --radius-pill: 20px;
      --radius-btn: 8px;
      --max-width: 900px;
    }

    /* CSS Reset */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    a:hover {
      color: var(--accent-hover);
    }

    /* Layout */
    .container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 24px;
    }

    section {
      padding: 80px 0;
    }

    .section-title {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 32px;
      color: var(--text-primary);
    }

    .section-title .accent {
      color: var(--accent);
    }

    /* Hero */
    .hero {
      text-align: center;
      padding: 100px 0 80px;
    }

    .hero .avatar {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 3px solid var(--accent);
      object-fit: cover;
      margin: 0 auto 24px;
    }

    .hero h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .hero .tagline {
      font-size: 1.125rem;
      color: var(--text-secondary);
      margin-bottom: 32px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    .cta-group {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-primary {
      display: inline-block;
      padding: 12px 28px;
      background-color: var(--accent);
      color: var(--bg-primary);
      font-weight: 700;
      border-radius: var(--radius-btn);
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
      color: var(--bg-primary);
      transform: translateY(-1px);
    }

    .btn-secondary {
      display: inline-block;
      padding: 12px 28px;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-weight: 700;
      border-radius: var(--radius-btn);
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .btn-secondary:hover {
      background-color: rgba(170, 255, 0, 0.1);
      transform: translateY(-1px);
    }

    /* About */
    .about p {
      font-size: 1.05rem;
      color: var(--text-secondary);
      line-height: 1.8;
      max-width: 750px;
    }

    .about .highlight {
      color: var(--text-primary);
      font-weight: 600;
    }

    /* Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 24px;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .card .card-icon {
      font-size: 1.5rem;
      margin-bottom: 12px;
    }

    .card h3 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .card p {
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    /* Photo Grid */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .photo-grid img {
      border-radius: var(--radius-card);
      width: 100%;
      height: 220px;
      object-fit: cover;
      border: 1px solid var(--border);
      transition: border-color 0.2s ease;
    }

    .photo-grid img:hover {
      border-color: var(--accent);
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 16px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      font-size: 0.85rem;
      color: var(--text-primary);
    }

    .badge-link {
      text-decoration: none;
      transition: border-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
      cursor: pointer;
    }

    .badge-link:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-1px);
    }

    /* Articles */
    .articles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .article-card {
      display: block;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 20px;
      transition: border-color 0.2s ease, transform 0.2s ease;
      color: var(--text-primary);
    }

    .article-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      color: var(--text-primary);
    }

    .article-card h3 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .article-card .article-meta {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .read-more-links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .read-more-links a {
      padding: 8px 20px;
      border: 1px solid var(--border);
      border-radius: var(--radius-btn);
      font-size: 0.85rem;
      color: var(--text-secondary);
      transition: border-color 0.2s ease, color 0.2s ease;
    }

    .read-more-links a:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Slides */
    .slides-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .slide-item {
      display: block;
      padding: 16px 20px;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      transition: border-color 0.2s ease;
      color: var(--text-primary);
    }

    .slide-item:hover {
      border-color: var(--accent);
      color: var(--text-primary);
    }

    .slide-item .slide-title {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .slide-item .slide-meta {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    /* Tech Stack */
    .tech-category {
      margin-bottom: 24px;
    }

    .tech-category h3 {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .tech-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tech-pill {
      padding: 6px 14px;
      background-color: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      font-size: 0.8rem;
      color: var(--text-primary);
      transition: border-color 0.2s ease;
    }

    .tech-pill:hover {
      border-color: var(--accent);
    }

    /* Developer Card */
    .dev-card {
      text-align: center;
    }

    .devcard-img {
      max-width: 100%;
      height: auto;
      border-radius: var(--radius-card);
      border: 1px solid var(--border);
      transition: border-color 0.2s ease;
    }

    .devcard-img:hover {
      border-color: var(--accent);
    }

    /* Certifications */
    .certs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .cert-card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 24px;
      text-align: center;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .cert-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .cert-icon {
      font-size: 2rem;
      margin-bottom: 12px;
    }

    .cert-card h3 {
      color: var(--text-primary);
      font-size: 0.95rem;
      margin-bottom: 8px;
    }

    .cert-card p {
      color: var(--text-secondary);
      font-size: 0.8rem;
    }

    .cert-links {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
    }

    .cert-links a {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.85rem;
      transition: opacity 0.2s ease;
    }

    .cert-links a:hover {
      opacity: 0.8;
      text-decoration: underline;
    }

    /* Connect */
    .connect-links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .connect-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-btn);
      font-size: 0.9rem;
      color: var(--text-primary);
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .connect-link:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-1px);
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 40px 24px;
      border-top: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.85rem;
    }

    /* Loading state */
    .loading {
      color: var(--text-secondary);
      font-size: 0.9rem;
      padding: 20px;
      text-align: center;
    }

    /* Responsive */
    @media (max-width: 768px) {
      section {
        padding: 48px 0;
      }

      .hero {
        padding: 60px 0 48px;
      }

      .hero h1 {
        font-size: 1.8rem;
      }

      .hero .tagline {
        font-size: 1rem;
      }

      .hero .avatar {
        width: 120px;
        height: 120px;
      }

      .section-title {
        font-size: 1.4rem;
      }

      .photo-grid {
        grid-template-columns: 1fr;
      }

      .photo-grid img {
        height: 180px;
      }

      .cards-grid {
        grid-template-columns: 1fr;
      }

      .articles-grid {
        grid-template-columns: 1fr;
      }

      .connect-links {
        flex-direction: column;
      }

      .connect-link {
        justify-content: center;
      }

      .cta-group {
        flex-direction: column;
        align-items: center;
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 0 16px;
      }

      .hero h1 {
        font-size: 1.5rem;
      }

      .badges {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main>
    {{ content }}
  </main>

  <footer class="footer">
    <p>&copy; 2025 Ifan Zalukhu. Built with code and coffee.</p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      var container = document.getElementById('articles-grid');
      if (!container) return;
      try {
        var res = await fetch('https://dev.to/api/articles?username=ifanzalukhu97&per_page=4');
        if (!res.ok) throw new Error('API error');
        var articles = await res.json();
        if (articles.length === 0) {
          container.innerHTML = '<p class="loading">No articles yet. Check out my <a href="https://dev.to/ifanzalukhu97">dev.to profile</a>.</p>';
          return;
        }
        container.innerHTML = articles.map(function(a) {
          var date = new Date(a.published_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
          return '<a href="' + a.url + '" target="_blank" rel="noopener" class="article-card">' +
            '<h3>' + a.title + '</h3>' +
            '<span class="article-meta">' + date + ' &middot; ' + a.reading_time_minutes + ' min read</span>' +
            '</a>';
        }).join('');
      } catch (e) {
        container.innerHTML = '<p class="loading">Check out my articles on <a href="https://dev.to/ifanzalukhu97">dev.to</a></p>';
      }
    });
  </script>
</body>
</html>
